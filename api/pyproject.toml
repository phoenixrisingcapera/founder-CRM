[project]
name = "aistack-founder-crm-api"
version = "0.1.0"
description = "FastAPI backend for AiStack Founder CRM"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "alembic==1.13.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-multipart==0.0.9",
  "psycopg[binary]==3.2.3",
  "PyJWT==2.10.1",
  "PyMuPDF==1.24.10",
  "python-pptx==1.0.2",
  "httpx==0.27.2",
  "cryptography==43.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
